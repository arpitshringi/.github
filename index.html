<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jatayu Victory - Alternate Ramayana</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0b061a, #1a0f2e);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            z-index: 10;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 12px;
            color: #ccc;
        }
        /* Stage Area */
        .stage {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 350px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            background: radial-gradient(circle, #2c1654 0%, #0b061a 100%);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.3);
        }
        /* Characters */
        .viman {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            animation: floatViman 3s ease-in-out infinite;
        }
        .ravan {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 35px;
            transition: all 1s ease;
        }
        .sita {
            position: absolute;
            top: 50%;
            left: 40%;
            font-size: 30px;
            transition: all 1s ease;
        }
        .jatayu {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 50px;
            animation: attackJatayu 8s infinite;
        }
        .chains {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            opacity: 0;
            animation: showChains 8s infinite;
        }
        /* Animations */
        @keyframes floatViman {
            0%, 100% { transform: translate(-50%, -52%); }
            50% { transform: translate(-50%, -48%); }
        }
        @keyframes attackJatayu {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(120px, -150px) scale(1.2) rotate(-15deg); }
            40% { transform: translate(80px, -120px) scale(1); }
            55% { transform: translate(150px, -140px) scale(1.3); }
            70% { transform: translate(100px, -130px) rotate(0deg); }
            100% { transform: translate(0, 0); }
        }
        @keyframes showChains {
            0%, 50% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            55%, 90% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; }
        }
        /* Subtitle Box */
        #subtitle-box {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 12px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: #fff;
            font-size: 15px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            animation: changeText 8s infinite;
        }
        @keyframes changeText {
            0% { content: "युद्ध प्रारम्भ... जटायु ने पुष्पक विमान पर आक्रमण किया!"; }
            33% { content: "रावण के प्रहार को रोकते हुए वीर जटायु!"; }
            66% { content: "महा ट्विस्ट! जटायु ने रावण को बांधकर बंदी बना लिया और सीता माता को छुड़ाया!"; }
            100% { content: "धर्म की महा विजय!"; }
        }
        .footer-note {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>रामायण: धर्म की महा विजय</h1>
        <p>Alternate Timeline Animation</p>
    </div>

    <div class="stage">
        <div class="viman">🛸</div>
        <div class="sita">👸</div>
        <div class="ravan">👹</div>
        <div class="chains">✨⛓️✨</div>
        <div class="jatayu">🦅</div>
    </div>

    <div id="subtitle-box">युद्ध प्रारम्भ... जटायु ने पुष्पक विमान पर आक्रमण किया!</div>
    <div class="footer-note">Iska screen recorder on karke direct video bana le bhai!</div>
</body>
</html>
